spring.application.name=knect_app_backend
server.port=${PORT:8080}

# MySQL Database Configuration (auto-creates knect_db if it does not exist)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/knect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:SAR?mySQL0210}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart Uploads (RNF-02)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Security Configuration (RNF-03)
app.jwt.secret=${JWT_SECRET:KnectSuperSecretKeyForJwtAuthentication2026MustBeAtLeast32BytesLong!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Contact / Notification Configuration (RF-03 / RNF-05)
app.contact.admin-email=${ADMIN_EMAIL:administracion@knect.com}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
